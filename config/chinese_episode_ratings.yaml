# Curated star ratings for Chinese + bilingual podcasts.
# Enforced with config/template.yaml rating_distribution:
#   5★ ≤ floor(n × 20%), 4★ ≤ floor(n × 30%), default 3★.
#
# Rubric (same for all shows):
#   3★ — solid, useful episode; default
#   4★ — unusually strong insight, rare guest access, or durable framework
#   5★ — landmark reference episode (re-listen / cite years later)
# Do NOT default new episodes to 5★ because they are recent.
# Prefer leaving 5★/4★ headroom when curated lists allow.

